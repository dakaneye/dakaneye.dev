        Moved every install off ingress-nginx onto Traefik and the Gateway
        API, updating the Helm chart, the Kubernetes operator, and the
        installer together so on-prem runs the same routing stack as the cloud
        product. Existing customers upgraded in place.
      - >-
        Made releases repeatable with required checks, branch protection, and
