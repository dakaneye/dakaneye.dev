    summary: Identity, routing, and release gates for software customers run themselves.
    bullets:
      - >-
        Chose and integrated Keycloak as the identity layer for NetBox's new
        platform apps, wired to an in-house authorization server. Customers
        sign in with their own company accounts, a sign-in survives losing a
