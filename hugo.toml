baseURL = 'https://dakaneye.dev/'
languageCode = 'en-us'
title = 'Sam Dacanay'

# Build settings
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = false
disableKinds = ['taxonomy', 'term']

# Minification
[minify]
  disableXML = true

# Output formats
[outputs]
  home = ['HTML', 'RSS']

# Sitemap
[sitemap]
  changefreq = 'monthly'
  priority = 0.5

# Menu
[menu]
  [[menu.main]]
    identifier = 'about'
    name = 'about'
    url = '/'
    weight = 10
  [[menu.main]]
    identifier = 'projects'
    name = 'projects'
    url = '/projects/'
    weight = 20
  [[menu.main]]
    identifier = 'writing'
    name = 'writing'
    url = '/writing/'
    weight = 30
  [[menu.main]]
    identifier = 'resume'
    name = 'resume'
    url = '/resume/'
    weight = 40

[params]
  description = 'Staff Software Engineer, Tech Lead for on-prem delivery. Distributed systems, Kubernetes, supply chain security.'
  author = 'Sam Dacanay'
  role = 'staff swe · tech lead'
  keywords = ['software engineer', 'distributed systems', 'kubernetes', 'supply chain security', 'on-prem', 'go', 'java']

  [[params.social]]
    name = 'github'
    url = 'https://github.com/dakaneye'
  [[params.social]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/sam-dacanay'
  [[params.social]]
    name = 'rss'
    url = '/index.xml'

# Markup settings
[markup]
  [markup.highlight]
    style = 'github-dark'
    lineNos = false
    noClasses = true
