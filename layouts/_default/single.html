{{ define "main" }}
<article>
  <header>
    {{ partial "prompt.html" (printf "cat %s.md" .File.ContentBaseName) }}
    <h1 class="page-title">{{ .Title }}</h1>
    {{- if not .Date.IsZero }}
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{- with .Params.tags }} · {{ delimit . " · " }}{{ end }}
    </p>
    {{- end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
