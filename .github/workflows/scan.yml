name: Monthly Scan

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Grype filesystem scan
        uses: anchore/scan-action@c9aea63e48aa066ca270c0e6e0ce84137230a295 # main
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        if: always()
        with:
          sarif_file: results.sarif
